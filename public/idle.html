<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>BriQ Experience Center</title>
<style>
  :root { color-scheme: dark; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; align-items: center; justify-content: center;
    background: #07070b; color: #f5f1e8;
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  .card { text-align: center; }
  .eyebrow {
    color: #e8c069; font-size: 15px; font-weight: 700;
    letter-spacing: 2px; text-transform: uppercase; margin-bottom: 12px;
  }
  h1 { font-size: 34px; margin: 0 0 12px; }
  .sub { color: #a6a2b0; font-size: 17px; max-width: 480px; margin: 0 auto 32px; }
  .row { display: flex; align-items: center; justify-content: center; gap: 40px; }
  .code { font-size: 56px; font-weight: 800; letter-spacing: 10px; color: #e8c069; }
  .status { display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 16px; color: #a6a2b0; font-size: 14px; }
  .dot { width: 8px; height: 8px; border-radius: 4px; background: #716d7a; }
  .dot.good { background: #34d399; }
  .qr { background: #15151d; padding: 16px; border-radius: 10px; }
  .qr img { display: block; width: 160px; height: 160px; }
  .device-id { color: #716d7a; font-size: 12px; margin-top: 28px; }
</style>
</head>
<body>
  <div class="card">
    <div class="eyebrow">BriQ Experience Center</div>
    <h1>Pair this TV</h1>
    <div class="sub">Open the BriQ Experience controller app, scan this code, and pick a project to present.</div>
    <div class="row">
      <div>
        <div class="code" id="code">······</div>
        <div class="status"><span class="dot" id="dot"></span><span id="statusText">Connecting…</span></div>
      </div>
      <div class="qr"><img id="qr" alt="Pairing QR" /></div>
    </div>
    <div class="device-id" id="deviceId"></div>
  </div>

  <script>
    function connect() {
      const ws = new WebSocket(`ws://${location.host}/idle-ws`);
      ws.onopen = () => setStatus(true);
      ws.onclose = () => { setStatus(false); setTimeout(connect, 2000); };
      ws.onerror = () => ws.close();
      ws.onmessage = (e) => {
        try {
          const data = JSON.parse(e.data);
          if (data.pairingCode) document.getElementById('code').textContent = data.pairingCode;
          if (data.qrDataUri) document.getElementById('qr').src = data.qrDataUri;
          if (data.deviceId) document.getElementById('deviceId').textContent = `Device ${data.deviceId}`;
        } catch {}
      };
    }
    function setStatus(connected) {
      document.getElementById('dot').className = 'dot' + (connected ? ' good' : '');
      document.getElementById('statusText').textContent = connected ? 'Ready' : 'Connecting…';
    }
    connect();
  </script>
</body>
</html>
